<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 900 425" role="img" aria-label="Under construction sign with caution tape reading 'corny content ahead', a traffic cone, and a construction worker asleep next to their coffee">
  <defs>
    <pattern id="haz" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#111"/>
      <rect x="20" width="20" height="40" fill="#FFC83D"/>
    </pattern>
  </defs>

  <!-- posts -->
  <rect x="232" y="270" width="18" height="172" fill="#8A5A2B" stroke="#111" stroke-width="4"/>
  <rect x="650" y="270" width="18" height="172" fill="#8A5A2B" stroke="#111" stroke-width="4"/>

  <!-- crooked sign: one bolt short of a full set -->
  <g transform="rotate(-3 450 180)">
    <rect x="150" y="70" width="600" height="220" rx="12" fill="#FFC83D" stroke="#111" stroke-width="8"/>
    <rect x="168" y="88" width="564" height="184" rx="6" fill="none" stroke="#111" stroke-width="3" stroke-dasharray="14 10"/>
    <text x="450" y="160" text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', sans-serif" font-size="78" fill="#111" letter-spacing="6">UNDER</text>
    <text x="450" y="245" text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', sans-serif" font-size="78" fill="#111" textLength="520" lengthAdjust="spacingAndGlyphs">CONSTRUCTION</text>
    <circle cx="172" cy="92" r="6" fill="#555"/>
    <circle cx="728" cy="92" r="6" fill="#555"/>
    <circle cx="172" cy="268" r="6" fill="#555"/>
  </g>

  <!-- caution tape -->
  <g transform="rotate(5 450 298)">
    <rect x="-40" y="280" width="980" height="36" fill="#FFC83D" stroke="#111" stroke-width="3"/>
    <text x="450" y="305" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="19" fill="#111" letter-spacing="2">CAUTION ✦ CORNY CONTENT AHEAD ✦ CAUTION ✦ CORNY CONTENT AHEAD</text>
  </g>

  <!-- sleeping worker (the entire crew) -->
  <rect x="64" y="412" width="22" height="26" rx="3" fill="#fff" stroke="#111" stroke-width="3"/>
  <path d="M86 418 q10 0 10 8 q0 8 -10 8" fill="none" stroke="#111" stroke-width="3"/>
  <path d="M70 404 q-5 -8 0 -16 M80 404 q-5 -8 0 -16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

  <rect x="125" y="402" width="100" height="26" rx="13" fill="#E8752A" stroke="#111" stroke-width="3"/>
  <rect x="150" y="402" width="8" height="26" fill="#F4F4F4"/>
  <rect x="190" y="402" width="8" height="26" fill="#F4F4F4"/>
  <rect x="220" y="406" width="60" height="18" rx="8" fill="#3A5A8C" stroke="#111" stroke-width="3"/>
  <rect x="276" y="400" width="18" height="30" rx="4" fill="#111"/>
  <circle cx="114" cy="412" r="20" fill="#F2C9A0" stroke="#111" stroke-width="3"/>
  <path d="M100 389 A23 23 0 0 0 100 435 Z" fill="#FFC83D" stroke="#111" stroke-width="3"/>
  <path d="M108 404 q5 4 10 0" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="122" cy="419" r="3.5" fill="#111"/>

  <g font-family="Impact, 'Arial Black', sans-serif" fill="#fff" stroke="#111" stroke-width="1.5">
    <text x="138" y="388" font-size="22">z</text>
    <text x="158" y="366" font-size="30">Z</text>
    <text x="186" y="338" font-size="38">Z</text>
  </g>

  <!-- traffic cone -->
  <polygon points="768,440 832,440 810,345 790,345" fill="#FF7A1A" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="784,405 816,405 812,385 788,385" fill="#fff"/>
  <rect x="752" y="436" width="96" height="10" rx="3" fill="#FF7A1A" stroke="#111" stroke-width="4"/>

  <!-- ground -->
  <rect x="0" y="446" width="900" height="24" fill="url(#haz)" stroke="#111" stroke-width="3"/>
</svg>
